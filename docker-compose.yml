version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: lagdoki_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app:/app/services/api
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - .:/app